name: Build
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Build with Gradle
        run: gradle build
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: maza-addon
          path: build/libs/*.jar
          
