name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Installs this exact Gradle, so the build no longer depends on the runner's Gradle
      # or on the wrapper files in the repo. Loom 1.14 needs Gradle 9.2 or newer.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Build
        run: gradle build --no-daemon --stacktrace

      - name: Upload jars
        uses: actions/upload-artifact@v4
        with:
          name: maza-addon
          path: build/libs/*.jar
